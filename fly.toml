# fly.toml app configuration file generated for openai-cpa-bfenfw on 2026-04-19T17:36:35Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'openai-cpa-bfenfw'
primary_region = 'ams'

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
[mounts]
  source = "cpa_data"
  destination = "app/data"
